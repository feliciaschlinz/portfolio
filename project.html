<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project — Felicia Schlinz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.crumb{display:inline-block;margin-bottom:26px;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.crumb a{border-bottom:2px solid currentColor}
h1.pt{color:var(--o);font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(56px,11vw,180px);line-height:.9;margin:0;letter-spacing:-.005em}
.lead{font-size:clamp(22px,2.6vw,36px);font-weight:700;line-height:1.1;letter-spacing:-.02em;color:var(--o);max-width:34ch;margin:36px 0 0}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:24px;margin:56px 0 0;padding-top:22px;border-top:1.5px solid var(--o)}
.meta dt{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.meta dd{margin:4px 0 0;font-size:16px}
.frame{border-radius:20px;overflow:hidden;position:relative;background:var(--card)}
.frame img{display:block;width:100%;height:auto}
.frame.ph{aspect-ratio:16/10;display:flex;align-items:flex-end}
.frame .hint{margin:16px;padding:6px 12px;border-radius:99px;background:var(--bg);color:var(--ot);font-size:13px;font-weight:700;position:relative}
.blk{display:grid;grid-template-columns:1fr 2.4fr;gap:clamp(24px,5vw,80px);padding-top:clamp(70px,9vw,120px)}
@media(max-width:800px){.blk{grid-template-columns:1fr;gap:18px}}
.lab{font-family:var(--display);color:var(--o);text-transform:uppercase;font-size:clamp(34px,4vw,56px);line-height:1}
.body p{font-size:clamp(18px,1.5vw,21px);max-width:64ch;margin:0 0 1.1em}
.ach{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:32px}
.ach b{display:block;font-family:var(--display);font-weight:400;color:var(--o);font-size:clamp(48px,6vw,88px);line-height:1}
.ach span{display:block;margin-top:8px;font-size:16px}
.steps{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--o)}
.steps li{display:grid;grid-template-columns:60px 1fr;gap:16px;padding:22px 0;border-bottom:1.5px solid var(--o)}
.steps .n{font-family:var(--display);color:var(--o);font-size:32px;line-height:1}
.steps h3{margin:0 0 6px;font-size:clamp(22px,2.4vw,32px);color:var(--o);letter-spacing:-.02em;line-height:1.05}
.steps p{margin:0;font-size:17px}
.hl{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--o)}
.hl li{padding:16px 0 16px 30px;border-bottom:1.5px solid var(--o);position:relative;font-size:18px}
.hl li::before{content:"";position:absolute;left:0;top:25px;width:12px;height:12px;border-radius:50%;background:var(--o)}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:clamp(60px,8vw,110px)}
.gal figure{margin:0}
.gal figure.wide{grid-column:1/-1}
@media(max-width:700px){.gal{grid-template-columns:1fr}}
.gal figcaption{font-size:14px;margin-top:8px}
.quote{font-size:clamp(26px,3.6vw,52px);font-weight:700;line-height:1.08;letter-spacing:-.02em;color:var(--o);margin:0;max-width:30ch}
.next{display:block;margin-top:clamp(80px,10vw,140px);border-top:1.5px solid var(--o);border-bottom:1.5px solid var(--o);padding:34px 0;transition:background .3s,padding .3s}
.next small{display:block;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.next b{display:block;font-family:var(--display);font-weight:400;text-transform:uppercase;color:var(--o);font-size:clamp(44px,9vw,140px);line-height:.95}
.next:hover{background:var(--o);padding-left:20px;padding-right:20px}
.next:hover b{color:var(--bg)}
</style>
</head>
<body>
<a class="skip" href="#top">Skip to content</a>
<div id="site-nav"></div>
<script src="nav.js"></script>

<main id="top"><div id="project"></div></main>
<div id="site-footer"></div>
<script src="footer.js"></script>

<script src="projects.js"></script>
<script>
(function () {
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function paras(a) { return (a || []).map(function (t) { return '<p>' + esc(t) + '</p>'; }).join(''); }
  function sec(label, inner) { return inner ? '<section class="pad blk rv"><div class="lab">' + label + '</div><div class="body">' + inner + '</div></section>' : ''; }
  function img(src, alt, i) {
    return '<div class="frame t' + (i % 6) + '"><img src="' + esc(src) + '" alt="' + esc(alt || '') + '" loading="lazy" data-src="' + esc(src) + '"></div>';
  }

  var root = document.getElementById('project');
  var slug = new URLSearchParams(location.search).get('p');
  var idx = PROJECTS.findIndex(function (x) { return x.slug === slug; });

  if (idx < 0) {
    root.innerHTML = '<section class="pad" style="padding-top:150px"><h1 class="pt">Not found</h1><p class="lead">That project doesn\'t exist yet.</p><a class="more" href="work.html">See all work ↗</a></section>';
    return;
  }
  var p = PROJECTS[idx];
  document.title = p.title + ' — Felicia Schlinz';

  var meta = [['Client', p.client], ['Role', p.role], ['Team', p.team], ['Timeline', p.timeline], ['Tools', (p.tools || []).join(', ')]]
    .filter(function (m) { return m[1]; })
    .map(function (m) { return '<div><dt>' + m[0] + '</dt><dd>' + esc(m[1]) + '</dd></div>'; }).join('');

  var html = '<section class="pad" style="padding-top:150px">' +
    '<div class="crumb"><a href="work.html">← All work</a></div>' +
    '<h1 class="pt">' + esc(p.title) + '</h1>' +
    '<p class="lead">' + esc(p.summary) + '</p>' +
    (meta ? '<dl class="meta">' + meta + '</dl>' : '') +
    '</section>';

  if (p.hero) html += '<section class="pad" style="padding-top:48px">' + img(p.hero, p.title, 0) + '</section>';

  html += sec('Overview', paras(p.overview));
  html += sec('The challenge', paras(p.challenge));
  html += sec('Approach', p.approach && p.approach.length ? '<ol class="steps">' + p.approach.map(function (s, i) {
    return '<li><span class="n">' + String(i + 1).padStart(2, '0') + '</span><div><h3>' + esc(s.title) + '</h3><p>' + esc(s.text) + '</p></div></li>';
  }).join('') + '</ol>' : '');
  html += sec('By the numbers', p.achievements && p.achievements.length ? '<div class="ach">' + p.achievements.map(function (a) {
    return '<div><b>' + esc(a.value) + '</b><span>' + esc(a.label) + '</span></div>';
  }).join('') + '</div>' : '');
  html += sec('Highlights', p.highlights && p.highlights.length ? '<ul class="hl">' + p.highlights.map(function (h) { return '<li>' + esc(h) + '</li>'; }).join('') + '</ul>' : '');

  if (p.gallery && p.gallery.length) {
    html += '<section class="pad"><div class="gal">' + p.gallery.map(function (g, i) {
      return '<figure class="rv' + (g.wide ? ' wide' : '') + '">' + img(g.src, g.alt, i + 1) + (g.caption ? '<figcaption>' + esc(g.caption) + '</figcaption>' : '') + '</figure>';
    }).join('') + '</div></section>';
  }

  html += sec('Results', p.results && p.results.length ? '<p class="quote">' + esc(p.results[0]) + '</p>' + paras(p.results.slice(1)) : '');

  var next = null;
  for (var k = 1; k < PROJECTS.length; k++) {
    var c = PROJECTS[(idx + k) % PROJECTS.length];
    if (c.published) { next = c; break; }
  }
  if (!next) next = PROJECTS[(idx + 1) % PROJECTS.length];
  html += '<section class="pad"><a class="next" href="' + esc(next.href) + '"' + (next.external ? ' target="_blank" rel="noopener"' : '') + '><small>Next project</small><b>' + esc(next.title) + ' ↗</b></a></section>';

  root.innerHTML = html;

  // missing images become labelled placeholders showing which file to add
  root.querySelectorAll('.frame img').forEach(function (im) {
    function bad() {
      var f = im.parentNode;
      f.classList.add('ph');
      f.innerHTML = '<span class="hint">Add image: ' + esc(im.dataset.src) + '</span>';
    }
    im.addEventListener('error', bad);
    if (im.complete && im.naturalWidth === 0) bad();
  });

  var io = new IntersectionObserver(function (es) {
    es.forEach(function (x) { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } });
  }, { threshold: 0.08 });
  root.querySelectorAll('.rv').forEach(function (el) { io.observe(el); });
})();
</script>
</body>
</html>
